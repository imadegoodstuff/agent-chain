# AGENT CHAIN website — https://agent-chain.agency (fallback https://agentchain-web.fly.dev)
# Deploy from the repo root (docs/ live one level above apps/web):
#   fly deploy --remote-only --config apps/web/fly.toml --dockerfile apps/web/Dockerfile .
app = "agentchain-web"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NEXT_PUBLIC_RPC_URL = "https://rpc.agent-chain.agency"
  NEXT_PUBLIC_EXPLORER_URL = "https://explorer.agent-chain.agency"
  NEXT_PUBLIC_SITE_URL = "https://agent-chain.agency"
  STATS_RPC_URL = "https://agentchain-rpc.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
