# AGENT CHAIN Beta bridge relayer — https://agentchain-relayer.fly.dev/status
# Exactly ONE machine must run (the state file on the volume is the double-payment guard): deploy with --ha=false.
app = "agentchain-relayer"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  STATE_FILE = "/data/relayer-state.json"
  BSC_RPC_URLS = "https://bsc-dataseed.bnbchain.org,https://bsc-rpc.publicnode.com"
  BRIDGE_ADDRESS = "0x9eF8CA94a74B7Fbc5ae0b1F7a2dCaFCa14eE2A92"
  BRIDGE_DEPLOY_BLOCK = "134642093"
  # Private sequencer over Fly 6PN (same org); the gateway URL also works (owner is allow-listed).
  L2_RPC_URL = "http://agentchain-node.internal:8547"
  L2_CHAIN_ID = "1119"
  CONFIRMATIONS = "20"
  CHUNK_BLOCKS = "1000"
  POLL_INTERVAL_MS = "15000"
  # Secrets: CHAIN_OWNER_PRIVATE_KEY

[mounts]
  source = "relayer_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[restart]]
  policy = "always"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
